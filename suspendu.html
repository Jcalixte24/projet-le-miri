<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site suspendu — Groupe Scolaire Le Miri</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', 'Open Sans', Arial, sans-serif;
    background:#F5EDD8;
    color:#2A1C11;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:2rem;
  }
  .card{
    background:#FFFFFF;
    border:1.5px solid #2A1C11;
    border-top:5px solid #C4A93D;
    border-radius:6px;
    max-width:440px;
    width:100%;
    padding:3rem 2.5rem;
    text-align:center;
    box-shadow:0 12px 32px rgba(92,61,26,.12);
  }
  .logo{
    height:64px;
    width:auto;
    max-width:220px;
    object-fit:contain;
    margin-bottom:1.5rem;
  }
  h1{
    font-size:1.4rem;
    font-weight:700;
    color:#2A1C11;
    margin-bottom:.75rem;
  }
  p{
    font-size:.9rem;
    color:#5A4E46;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://static.wixstatic.com/media/568692_f9b4440e8b2e4586bd61ffab50a3f1d2~mv2.jpg" alt="Logo Groupe Scolaire Le Miri" onerror="this.style.display='none'">
    <h1>Site suspendu</h1>
    <p>Contactez le manager CTM</p>
  </div>
</body>
</html>
